<script>
const SB_URL='https://fzztrlhuixkfwixsdwcc.supabase.co',SB_KEY='sb_publishable_sCHdAi4NeF0o44N0QeFX6A_hpQC3Tz0';
const sb=supabase.createClient(SB_URL,SB_KEY);
const BOD=[301,302,303,304,306,307,308,309,311,312,314,315,316,318,319,320,321,322,323,324,325,328,329,330,331,332,333,334,335,336,337,338,339,501,502,503,504,505,801,802,803].map(n=>'B'+n);

const $=s=>document.querySelector(s),app=$('#app');
const e=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const head=(sub,r='')=>`<header><img src="icon.jpg" alt="NEXOCORP"><h1>PANEL INFORMATIVO LOGÍSTICA<small>${sub}</small></h1><div class="r">${r}</div></header>`;
const fh=d=>new Date(d).toLocaleString('es-BO',{dateStyle:'short',timeStyle:'short'});

function init(){location.hash=='#admin'?admin():portal()}

function hero(form,sub){return `<div class="hz"><div class="hz-in"><div><div class="hz-brand"><img src="icon.jpg" alt=""><span>NEXOCORP</span></div>
<h1>Portal<br>Logística Inversa</h1><p class="sub">${sub}</p>
<div class="hz-login">${form}</div></div>
<div class="sc"><div class="sc-in"><div class="orb o1"></div><div class="orb o2"></div><div class="tile"><div class="face"><img src="icon.jpg" alt=""></div><div class="face b"><img src="icon.jpg" alt=""></div></div>
</div></div></div>
<div class="hz-foot">Nexocorp · Logística Inversa · Uso interno · Versión ${VER}</div></div>`}
function tilt(){const sc=document.querySelector('.sc-in'),h=document.querySelector('.hz');if(!sc||!h)return;
  h.onmousemove=ev=>{sc.style.transform=`rotateY(${(ev.clientX/innerWidth-.5)*18}deg) rotateX(${-(ev.clientY/innerHeight-.5)*14}deg)`};h.onmouseleave=()=>{sc.style.transform=''}}

/* ================= PORTAL DE BODEGAS (con usuario y clave) ================= */
let S=[],CUR;
const TK=()=>sessionStorage.tk;
async function rpc(f,a){const r=await sb.rpc(f,{p_token:TK(),...a});if(r.error&&/SESION_EXPIRADA/.test(r.error.message)){salir();r.error.message='Tu sesión venció. Ingresa de nuevo.'}return r}
function salir(){sessionStorage.clear();portal()}
async function ingresar(){const b=$('#lb').value,c=$('#lc').value;if(!b||!c)return alert('Elige tu bodega e ingresa la clave');
  const{data,error}=await sb.rpc('login_bodega',{p_bod:b,p_clave:c});if(error||!data.ok)return alert(error?error.message:data.error);
  sessionStorage.tk=data.token;sessionStorage.bod=data.bodega;portal()}
async function portal(){
  if(!TK()){app.innerHTML=hero(`<h3>Ingreso de bodega</h3><select id="lb"><option value="">Elige tu bodega</option>${BOD.map(b=>`<option>${b}</option>`).join('')}</select><input id="lc" type="password" placeholder="Clave de tu bodega" onkeydown="event.key=='Enter'&&ingresar()"><button onclick="ingresar()">Ingresar</button><p class="mut">Tu usuario y clave inicial es el código de tu bodega. Si no puedes entrar, pide al administrador que la restablezca.</p>`,'Solicitudes, seguimiento y recepción de información entre las bodegas y logística.');return tilt()}
  app.innerHTML='<div class="pt">'+head('Portal Logística Inversa',`<span class="tag">${sessionStorage.bod}</span><button class="ghost" onclick="salir()">Salir</button>`)+'<main id="m"><p class="mut">Cargando…</p></main></div>';
  const r=await rpc('bod_solicitudes',{});if(r.error)return $('#m').innerHTML='<div class="card">No se pudo cargar: '+e(r.error.message)+'</div>';
  const k=s=>s.estado!='abierta'?2:s.procesado_at?1:0;S=r.data.sort((a,b)=>k(a)-k(b));const p=S.filter(s=>k(s)==0).length;
  $('#m').innerHTML=`<div class="wel"><h2>👋 Bienvenido, Bodega ${sessionStorage.bod}</h2><p>Portal Logística Inversa · ${p?`Tienes ${p} solicitud(es) pendiente(s)`:'Estás al día 🎉'}${S.some(s=>s.estado!='abierta')?' · Las solicitudes cerradas se ocultan solas en 2 días':''}</p></div>`+(S.length?S.map(card).join(''):'<p class="mut">No hay solicitudes activas por ahora.</p>');
}
const fx=d=>d?new Date(d+'T00:00').toLocaleDateString('es-BO',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}).toUpperCase():'';
const fc=d=>new Date(d+'T00:00').toLocaleDateString('es-BO',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).toUpperCase();
function recojo(s){const d=s.recojo_desde,h=s.recojo_hasta;if(!d)return'';return `<tr class="g"><th>📅 FECHA DE RECOJO:</th><td>${h&&h!=d?`DEL ${fc(d)} AL ${fc(h)}`:fx(d)}</td></tr>`}
const hoyL=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fd=d=>d?d.split('-').reverse().join('/'):'';
function lotes(s){const a=Array.isArray(s.cond_lotes)?s.cond_lotes:[];return a.length?a:(s.cond_activa&&(s.cond_lote||s.cond_fecha)?[{lote:s.cond_lote,fecha:s.cond_fecha}]:[])}
function lvRow(s){if(!(prods(s).length||s.cond_activa))return'';const L=lotes(s),t=L.length?L.map(x=>[x.lote&&'LOTE '+x.lote,x.fecha&&'VENCE '+fd(x.fecha)].filter(Boolean).join(' · ')):['TODO EL STOCK'];return `<tr><th>LOTE / VENCIMIENTO:</th><td class="big">${t.map(e).join('<br>')}</td></tr>`}
function prods(s){const a=Array.isArray(s.productos)?s.productos:[];return a.length?a:((s.codigo||s.producto)?[{codigo:s.codigo,producto:s.producto}]:[])}
function prRows(s){const P=prods(s);return P.length?`<tr class="y"><th>COD SKU / DESCRIPCIÓN:</th><td>${P.map(x=>e(x.codigo||'')+' &nbsp; '+e(x.producto||'')).join('<br>')}</td></tr>`:''}
function datos(s){
  const r=(k,v,c='')=>v?`<tr><th>${k}</th><td class="${c}">${e(v)}</td></tr>`:'';
  
  return `<table class="dr">${prRows(s)}
  ${lvRow(s)}${r('PROVEEDOR:',s.proveedor)}${r('MOTIVO:',s.motivo)}${r('BODEGAS DESTINO:',s.destino)}${recojo(s)}${r('PLAZO PARA PROCESAR:',fx(s.plazo))}${r('RÓTULO:',s.rotulo)}</table>`;
}
function card(s){
  const info=s.tipo=='informativa',ok=!!(s.procesado_at||(info&&s.visto_at)),cl=s.estado=='cerrada';
  const acc=info?(ok?`<span class="mut">Procesado el ${fh(s.procesado_at||s.visto_at)}${s.respuesta?`<br>“${e(s.respuesta)}”`:''}</span>`:`<div style="flex:1;min-width:240px"><label class="mut">Escribe el detalle del procesamiento (quién lo procesó, observaciones…)</label><input id="rp_${s.id}" placeholder="Ej.: Procesado por Juan, 3 cajas apartadas"><button onclick="proc('${s.id}')">✅ OK, procesado</button></div>`)
    :(ok?`<span class="mut">${s.sin_existencias?'Sin existencias':'Enviado'} el ${fh(s.procesado_at)}</span>`:`<button onclick="fill('${s.id}')">Llenar información</button>`);
  return `<div class="card ${cl&&!ok?'cl':ok?'ok':'pend'}"><h3>${e(s.titulo)} <span class="tag">${info?'Solo información':'Requiere llenado'}</span> <span class="tag st ${ok?'ok':''}">${ok?'✅ '+(info?'Procesado':'Enviado'):cl?'🔒 Cerrada':s.visto_at?'👁 Visto':'Pendiente'}</span></h3>
  ${s.descripcion?`<p class="mut">${e(s.descripcion)}</p>`:''}${datos(s)}${s.doc_url?`<p><a href="${e(s.doc_url)}" target="_blank">📎 Ver documento adjunto</a></p>`:''}<div class="row">${cl&&!ok?'<span class="mut">🔒 Cerrada: venció el plazo sin completarse</span>':acc}</div></div>`;
}
async function proc(id){const t=($('#rp_'+id).value||'').trim();if(!t)return alert('Escribe el campo antes de confirmar');
  if(!confirm('¿Confirmas que esta información fue procesada? No podrás deshacerlo.'))return;
  const r=await rpc('bod_procesar',{p_sol:id,p_texto:t});r.error?alert(r.error.message):portal()}
async function mark(id,x){if(!confirm('¿Confirmas que ya viste esta información? Quedará registrado para el administrador.'))return;
  const r=await rpc('bod_marcar',{p_sol:id,p_estado:x});r.error?alert(r.error.message):portal()}

let MK={v:null,t:0};
function maestra(){return new Promise(res=>{
  if(MK.v&&Date.now()-MK.t<12e4)return res(MK.v);
  const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:99';
  d.innerHTML='<div class="card" style="max-width:360px;width:90%"><h3>🔐 Clave maestra</h3><p class="mut">Esta acción está protegida. Ingresa la clave maestra para continuar.</p><input id="mk" type="password" autocomplete="off"><div class="row"><button id="mo">Confirmar</button><button class="ghost" id="mc">Cancelar</button></div></div>';
  document.body.appendChild(d);const i=d.querySelector('#mk');i.focus();const end=v=>{d.remove();res(v)};
  d.querySelector('#mo').onclick=()=>end(i.value||null);d.querySelector('#mc').onclick=()=>end(null);i.onkeydown=ev=>{if(ev.key=='Enter')end(i.value||null)}})}
async function prot(fn,args){const m=await maestra();if(!m)return null;
  const r=await sb.rpc(fn,{...args,p_maestra:m});
  if(r.error){alert(r.error.message);return null}
  if(r.data&&r.data.ok===false){MK.v=null;alert(r.data.error);return null}
  MK={v:m,t:Date.now()};return r.data||{ok:true}}
async function cambiarMaestra(){const n=$('#mn').value;if(n.length<8)return alert('La nueva clave maestra debe tener al menos 8 caracteres');if(n!==$('#mr').value)return alert('La confirmación no coincide');

async function wa(id,pend){
  const[s,b,c]=await Promise.all([sb.from('solicitudes').select('*').eq('id',id).single(),sb.from('solicitud_bodegas').select('*').eq('solicitud_id',id).order('bodega'),sb.from('bodega_contactos').select('*')]);
  if(c.error)return alert(c.error.message+'\n¿Ya ejecutaste migracion_5_whatsapp_lotes.sql?');
  WS=new Set();WM={b:b.data,c:c.data};const x=s.data,info=x.tipo=='informativa',link=location.origin+location.pathname,
   rj=x.recojo_desde?(x.recojo_hasta&&x.recojo_hasta!=x.recojo_desde?`del ${fd(x.recojo_desde)} al ${fd(x.recojo_hasta)}`:fd(x.recojo_desde)):'';
  const msg=`📢 *LOGÍSTICA INVERSA* · Hola Bodega {bodega}\n\n*${x.titulo}*\n${info?'Solo información: ingresa al portal, llena el campo y confirma "Procesado".':'Debes llenar la información en el portal.'}${x.plazo?`\n⏰ Plazo para procesar: ${fd(x.plazo)}`:''}${rj?`\n📅 Fecha de recojo: ${rj}`:''}\n\n🔗 ${link}\nIngresa con tu código de bodega y tu clave.`;
  $('#m').innerHTML=`<div class="row"><button class="ghost" onclick="lista()">← Volver</button></div><h2>📲 Avisar por WhatsApp · ${e(x.titulo)}</h2>
  <div class="card"><label class="mut">Mensaje (puedes editarlo; {bodega} se cambia por el código de cada bodega)</label><textarea id="wm" rows="9">${e(msg)}</textarea>
  <label class="sw"><input type="checkbox" id="wp" onchange="wlist()"> Solo bodegas pendientes (recordatorio)</label>
  <p class="mut">Sale desde el WhatsApp que tengas abierto en WhatsApp Web / Escritorio (tu número madre). Cada botón abre el chat con el mensaje listo: solo pulsas enviar y vuelves aquí.</p>
  <div class="row"><button onclick="wnext()">▶ Enviar al siguiente</button><span id="wc" class="mut"></span></div></div><div id="wl"></div>`;
  if(pend)$('#wp').checked=true;wlist();
}
function wlist(){
  const pend=$('#wp').checked;
  WL=WM.b.filter(x=>!pend||!x.procesado_at).flatMap(x=>{const cs=WM.c.filter(c=>c.bodega==x.bodega);return cs.length?cs.map(c=>({b:x.bodega,t:c.telefono})):[{b:x.bodega,t:null}]});
  $('#wl').innerHTML=`<div class="tw"><table style="min-width:520px"><thead><tr><th>BODEGA</th><th>NÚMERO</th><th></th></tr></thead><tbody>${WL.map((w,i)=>`<tr><td style="padding:8px"><b>${w.b}</b></td><td>${w.t?'+'+w.t:'⚠️ sin número'}</td><td>${w.t?`<button class="ghost" onclick="wsend(${i})">${WS.has(w.b+w.t)?'✅ Abierto · reabrir':'💬 Enviar'}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
  $('#wc').textContent=`${WL.filter(w=>w.t&&WS.has(w.b+w.t)).length} de ${WL.filter(w=>w.t).length} chats abiertos`;
}
function wsend(i){const w=WL[i],m=$('#wm').value.replace(/\{bodega\}/g,w.b);window.open(`https://wa.me/${w.t}?text=${encodeURIComponent(m)}`,'_blank');WS.add(w.b+w.t);wlist()}
function wnext(){const i=WL.findIndex(w=>w.t&&!WS.has(w.b+w.t));i<0?alert('Ya abriste todos los chats de la lista ✅'):wsend(i)}

/* ---- Accesos de bodegas ---- */
let ACC={};
async function accesos(){act('accesos');
  const r=await sb.rpc('admin_accesos');
  if(r.error)return $('#m').innerHTML='<div class="card">'+e(r.error.message)+'<br>¿Ya ejecutaste las migraciones SQL en Supabase?</div>';
  ACC=Object.fromEntries(r.data.map(x=>[x.bodega,x]));const falt=BOD.filter(b=>!ACC[b]).length;
  $('#m').innerHTML=`<div class="card"><h2>Accesos de bodegas</h2><p class="mut">Usuario y clave inicial = código de la bodega (ej. B301 / B301). Puedes cambiar la clave de cualquiera cuando haga falta; al cambiarla se desbloquea y se cierra su sesión.</p>
  <button onclick="clave('')" ${falt?'':'disabled'}>Crear claves faltantes (${falt})</button></div>
  <div class="card"><h3>🔐 Clave maestra</h3><p class="mut">Protege los cambios sensibles: claves de bodegas, números de WhatsApp, reabrir y eliminar solicitudes. Solo el administrador debe conocerla.</p><div class="g2"><input id="ma" type="password" placeholder="Clave maestra actual"><input id="mn" type="password" placeholder="Nueva (mínimo 8)"></div><input id="mr" type="password" placeholder="Repite la nueva"><button onclick="cambiarMaestra()">Cambiar clave maestra</button></div>
  <div class="tw"><table style="min-width:600px"><thead><tr><th>BODEGA</th><th>CLAVE</th><th>ÚLTIMO INGRESO</th><th></th></tr></thead><tbody>${BOD.map(b=>{const a=ACC[b];return `<tr><td style="padding:8px"><b>${b}</b></td><td>${a?(a.bloqueada?'🔒 Bloqueada (15 min)':a.personalizada?'🔑 Personalizada':'✅ Igual al código'):'⚠️ Sin clave'}</td><td>${a?.ultimo_acceso?fh(a.ultimo_acceso):'–'}</td><td><button class="ghost" onclick="clave('${b}')">Cambiar clave</button></td></tr>`}).join('')}</tbody></table></div>`;
}
async function clave(b){
  let c=null;
  if(b){c=prompt(`Nueva clave para ${b} (mínimo 4 caracteres).\nDéjala vacía para volver a ${b}.`);if(c===null)return;c=c.trim()||null}
  const l=b?[b]:BOD.filter(x=>!ACC[x]);if(!l.length)return;
  const r=await prot('admin_asignar_claves',{p_bodegas:l,p_clave:c});if(!r)return;
  alert(b?`Clave de ${b} actualizada${c?'':' (vuelve a ser '+b+')'}.`:'Listo: cada bodega entra con su código como clave.');accesos();
}
addEventListener('hashchange',init);init();
</script></body></html>
